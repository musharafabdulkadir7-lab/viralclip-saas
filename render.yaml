services:
  - type: web
    name: viralclip-saas
    env: docker
    dockerfilePath: ./Dockerfile
    startCommand: ./start.sh
    plan: free
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
